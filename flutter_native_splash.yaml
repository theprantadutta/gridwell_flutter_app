# dart run flutter_native_splash:create
#
# Tally: the page color of each theme (--bg) with the 2 x 2 mark centered at
# 104 dp, exactly where the Flutter splash (lib/ui/screens/splash_screen.dart)
# paints it, so the hand-off is seamless.
#
# Images are 4x: 416 px renders at 104 dp. Regenerate them with
# brand/make_splash.py (see brand/README-splash.md) if the mark ever changes.
flutter_native_splash:
  color: "#F6F8F0"
  color_dark: "#071A13"
  image: brand/splash/splash-light.png
  image_dark: brand/splash/splash-dark.png

  android_12:
    color: "#F6F8F0"
    color_dark: "#071A13"
    image: brand/splash/android12-light.png
    image_dark: brand/splash/android12-dark.png

  android: true
  ios: true
  web: false
  fullscreen: false
