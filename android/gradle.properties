org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Windows: the in-process Kotlin compiler fails with "Could not close
# incremental caches ... *.tab" for plugin modules (seen in Snake Classic too).
# Compiling in the Kotlin daemon with incremental caches off fixes it. Only
# plugin Kotlin and MainActivity are affected; all game code is Dart.
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=false
